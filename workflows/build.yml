name: build
on: [push, workflow_dispatch]
jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: false
      - uses: actions/upload-artifact@v4
        with:
          name: these-pdf
          path: main.pdf
